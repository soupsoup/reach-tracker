name: Collect public reach
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: reach-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python scripts/collect.py
      - name: Persist observations
        run: |
          git config user.name 'reach-tracker bot'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data
          git commit -m 'Record public reach snapshot'
          git push
