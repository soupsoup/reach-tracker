server {
    listen 80;
    listen [::]:80;
    server_name reach-tracker.antderosa.com;
    root /var/www/reach-tracker;
    index index.html;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 64k;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;

    # The checkout also holds code, packages, tests and the git data; serve
    # only the dashboard's own files.
    location ~ /\. { return 404; }
    location ~ ^/(deploy|server|lib|scripts|tests|node_modules)/ { return 404; }
    location ~ (\.md|\.py|package(-lock)?\.json)$ { return 404; }

    location ^~ /api/cron/ { return 404; }
    location ^~ /api/ { proxy_read_timeout 30s; proxy_pass http://127.0.0.1:4424; }
    location ^~ /data/ { add_header Cache-Control "no-store"; }
    location / { try_files $uri $uri/ /index.html; }
}
